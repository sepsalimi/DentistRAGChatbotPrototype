# Backend package, runtime dependencies, and test configuration for Dental Evidence Chat.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dental-evidence-chat-backend"
version = "0.1.0"
description = "Authorization-first FastAPI prototype for dental evidence chat."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pydantic>=2.10",
  "openai>=1.66",
  "llama-index-core>=0.12",
  "llama-index-embeddings-openai>=0.3",
  "llama-index-vector-stores-qdrant>=0.6",
  "qdrant-client>=1.13",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["dental_evidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
